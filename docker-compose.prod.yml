services:
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app_1
      - app_2
      - app_3

  app_1:
    build: .
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER}
      BASE62_KEY: ${BASE62_KEY}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_BROKER: ${KAFKA_BROKER}
      KAFKA_CLICK_TOPIC: ${KAFKA_CLICK_TOPIC}
      MONGO_URI: ${MONGO_URI}
      MONGO_DB: ${MONGO_DB}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo_analytics:
        condition: service_healthy
      kafka:
        condition: service_started

  app_2:
    build: .
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER}
      BASE62_KEY: ${BASE62_KEY}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_BROKER: ${KAFKA_BROKER}
      KAFKA_CLICK_TOPIC: ${KAFKA_CLICK_TOPIC}
      MONGO_URI: ${MONGO_URI}
      MONGO_DB: ${MONGO_DB}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo_analytics:
        condition: service_healthy
      kafka:
        condition: service_started

  app_3:
    build: .
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER}
      BASE62_KEY: ${BASE62_KEY}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_BROKER: ${KAFKA_BROKER}
      KAFKA_CLICK_TOPIC: ${KAFKA_CLICK_TOPIC}
      MONGO_URI: ${MONGO_URI}
      MONGO_DB: ${MONGO_DB}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo_analytics:
        condition: service_healthy
      kafka:
        condition: service_started

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:latest
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafkadata:/var/lib/kafka/data

  mongo_analytics:
    image: mongo:7.0
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand({ ping: 1 })'"]
      interval: 5s
      timeout: 5s
      retries: 5

  stream_consumer:
    build: .
    command: ["npm", "run", "worker:consumer"]
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3002
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_BROKER: ${KAFKA_BROKER}
      KAFKA_CLICK_TOPIC: ${KAFKA_CLICK_TOPIC}
      MONGO_URI: ${MONGO_URI}
      MONGO_DB: ${MONGO_DB}
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      kafka:
        condition: service_started
      mongo_analytics:
        condition: service_healthy

  subscription_reconciler:
    build: .
    command: ["npm", "run", "worker:reconciler"]
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3003
      DATABASE_URL: ${DATABASE_URL}
      SUBSCRIPTION_RECONCILE_INTERVAL_MS: ${SUBSCRIPTION_RECONCILE_INTERVAL_MS:-60000}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  kafkadata:
  mongodata:
