events {
    worker_connections 2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Extract true client IP if behind upstream CDN/Cloudflare/ELB
    # set_real_ip_from 0.0.0.0/0;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    # 1. Per-IP Rate Limit Zone (Leaky Bucket with burst)
    # 10MB zone tracks ~160,000 distinct IP addresses concurrently
    # rate=15r/s allows continuous replenishment of 15 requests per second per IP
    limit_req_zone $binary_remote_addr zone=per_ip_limit:10m rate=15r/s;

    # 2. Global Cluster Rate Limit Zone (Total Application Overload Protection)
    # Using a static string "global_app" applies this single bucket to ALL incoming traffic
    # rate=1000r/s protects backend databases/resources from cluster-wide traffic surges
    limit_req_zone "global_app" zone=global_limit:1m rate=1000r/s;

    # Return standard HTTP 429 Too Many Requests instead of default 503
    limit_req_status 429;

    # Upstream cluster using standard Round-Robin load balancing across N backends
    upstream logpose_cluster {
        server app_1:3000;
        server app_2:3000;
        server app_3:3000;
        keepalive 64;
    }

    server {
        listen 80;
        server_name localhost;

        # Standard JSON error response when rate limited
        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"status":"error","message":"Too many requests. Please slow down."}\n';
        }

        # Health check endpoint bypassed from rate limiting for cluster monitoring
        location = /api/health {
            proxy_pass http://logpose_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Main API & URL shortener traffic
        location / {
            # Enforce both Global capacity and individual Per-IP limits
            # nodelay allows immediate processing of burst traffic up to the burst ceiling
            limit_req zone=global_limit burst=300;
            limit_req zone=per_ip_limit burst=30 nodelay;

            proxy_pass http://logpose_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
